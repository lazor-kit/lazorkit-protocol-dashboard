<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Public LazorKit protocol dashboard: wallets, transactions, fees and deployments for Protocol v1 on Solana mainnet and devnet."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LazorKit Protocol Dashboard" />
    <meta
      property="og:description"
      content="LazorKit Protocol v1 activity: wallets, transactions, fees and deployments."
    />
    <meta property="og:image" content="https://lazorkit-protocol-dashboard.vercel.app/brand/mark-dark.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LazorKit Protocol Dashboard" />
    <meta
      name="twitter:description"
      content="LazorKit Protocol v1 activity: wallets, transactions, fees and deployments."
    />
    <meta name="twitter:image" content="https://lazorkit-protocol-dashboard.vercel.app/brand/mark-dark.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark-light.svg" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark light" />
    <title>LazorKit Protocol Dashboard</title>
    <script>
      try {
        var theme = localStorage.getItem('lk-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
